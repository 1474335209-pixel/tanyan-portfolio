<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PDF预览</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #525659; font-family: -apple-system, "PingFang SC", sans-serif; }
        .header {
            position: fixed; top: 0; left: 0; right: 0; height: 48px;
            background: #323639; color: #fff; display: flex; align-items: center;
            padding: 0 14px; z-index: 100; gap: 12px;
        }
        .header a { color: #fff; text-decoration: none; font-size: 14px; padding: 6px 14px; background: #4a4d50; border-radius: 6px; white-space: nowrap; }
        .progress-wrap { flex: 1; height: 4px; background: #444; border-radius: 2px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0; background: #4a9eff; transition: width .2s; }
        .progress-text { color: #ccc; font-size: 12px; white-space: nowrap; min-width: 44px; text-align: right; }
        #pdf-container { padding: 58px 0 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        canvas { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.3); width: 100%; max-width: 900px; height: auto; }
        #status { color: #fff; padding: 80px 24px; text-align: center; font-size: 15px; line-height: 1.8; }
        .retry-btn { margin-top: 16px; padding: 10px 24px; background: #4a9eff; color: #fff; border: 0; border-radius: 6px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="../index.html">← 返回</a>
        <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
        <span class="progress-text" id="ptext">加载中</span>
    </div>
    <div id="pdf-container">
        <div id="status">正在打开文档…</div>
    </div>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const params = new URLSearchParams(location.search);
        const file = params.get('file');
        const bar = document.getElementById('bar');
        const ptext = document.getElementById('ptext');

        function showError(msg) {
            const s = document.getElementById('status');
            if (s) s.innerHTML = msg + '<br><button class="retry-btn" onclick="location.reload()">重新加载</button>';
            ptext.textContent = '失败';
        }

        if (!file) { showError('缺少文件参数'); }
        else {
            const task = pdfjsLib.getDocument({ url: file, rangeChunkSize: 131072 });
            task.onProgress = function(e) {
                if (e.total) {
                    const pct = Math.min(100, Math.round(e.loaded / e.total * 100));
                    bar.style.width = pct + '%';
                    ptext.textContent = pct + '%';
                }
            };
            task.promise.then(async function(pdf) {
                const status = document.getElementById('status');
                if (status) status.remove();
                const container = document.getElementById('pdf-container');
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const screenW = window.innerWidth;
                for (let n = 1; n <= pdf.numPages; n++) {
                    const page = await pdf.getPage(n);
                    const baseVp = page.getViewport({ scale: 1 });
                    const cssScale = screenW / baseVp.width;
                    const renderVp = page.getViewport({ scale: cssScale * dpr });
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.floor(renderVp.width);
                    canvas.height = Math.floor(renderVp.height);
                    container.appendChild(canvas);
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport: renderVp }).promise;
                    ptext.textContent = n + '/' + pdf.numPages;
                }
                bar.style.width = '100%';
                ptext.textContent = '完成';
            }).catch(function(err) {
                showError('文档加载失败，请检查网络后重试');
                console.error(err);
            });
        }
    </script>
</body>
</html>
